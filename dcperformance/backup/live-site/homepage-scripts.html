<script type="text/javascript"> 
    $( document ).ready(function() {
        /* Direct Connections */
        $('.our-story .links-list a').click(function(e){
            e.preventDefault();
            var _this = $( this );
            var idTab = _this.attr('href');
            _this.parent().siblings().removeClass('active');
            _this.parent().addClass('active')
            $('.direct-tab').hide().removeClass('show');
            $(idTab).fadeToggle().addClass('show');
        });
        
        $('.our-story .links-list li:first-child').addClass('active');
    });
