function updateSearchModule() {
    const searchListingModule = document.querySelector('.search-listing-module');
    const catalogProductsList = searchListingModule.querySelectorAll('.catalog-product')
    
    for (i = 0; i < catalogProductsList.length; i++) {
        var product = catalogProductsList[i]
        var MSRP = product.querySelector('.list-price-label')
        MSRP.innerHTML = "MSRP<sup>*</sup>"
    }

    const paginator = document.querySelector('.paginator');
    if (paginator) {
        paginator.addEventListener('click', () => {
            setTimeout(function() {
                updateSearchModule()
            }, 5000)
        });
    }
};

function updateProductModule() {
    const productPurchaseModule = document.querySelector('.product-purchase-module');
    const listPriceLabel = productPurchaseModule.querySelector('.list-price .list-label');
    const youSaveLabel = productPurchaseModule.querySelector('.you-save .list-label');
    const salePriceLabel = productPurchaseModule.querySelector('.sale-price .list-label');
    const listPriceOnly = productPurchaseModule.querySelector('.list-price-only .list-price-label');

    productPurchaseModule.style.opacity = 1;

    if (listPriceLabel) {
        listPriceLabel.innerHTML = 'MSRP<sup>*</sup>:'
    }

    if (youSaveLabel) {
        youSaveLabel.innerText = "Dealer Discount:"
    }

    if (salePriceLabel) {
        salePriceLabel.innerText = "Price:"
    }

    if (listPriceOnly) {
        listPriceOnly.innerHTML = 'MSRP<sup>*</sup>:'
    }
};

function updateCartModule() {
    const addToCartModule = document.getElementById('rp_global_add_to_cart');
    const observerConfig = { childList: true };
    const observer = new MutationObserver(cartCallback);

    if (addToCartModule) {
        observer.observe(addToCartModule, observerConfig);
    }

    function cartCallback(mutationsList, observer) {
        const listPriceLabel = addToCartModule.querySelector('.list_price label');
        const salePriceLabel = addToCartModule.querySelector('.sale_price label');
        
        for(const mutation of mutationsList) {
            if (mutation.type === 'childList') {
                listPriceLabel.innerHTML = 'MSRP<sup>*</sup>'
                salePriceLabel.innerText = "Price"
                break;
            }
        }

        observer.disconnect();
        observer.observe(addToCartModule, {childList: true, subtree: true});
    };
};

function updateReplaceLabel() {
    // Swaps instances of "Other Names" for "Replaces"
    const productAKA = document.querySelector('.also_known_as .list-label');
    const  catalogAkaList= document.querySelectorAll('.catalog-also-known-as strong');

    if (productAKA) {
        productAKA.innerText = "Replaces:"
        const akaValueElm = document.querySelector('.also_known_as .list-value');
        if (akaValueElm) {
            var akaValue = akaValueElm.innerHTML;
            akaValue = akaValue.replace(", tuner", "");
            akaValue = akaValue.replace("tuner, ", "");
            akaValue = akaValue.replace("tuner", "");
            akaValue = akaValue.replace(", pulley", "");
            akaValue = akaValue.replace("pulley, ", "");
            akaValue = akaValue.replace("pulley", "");
            akaValueElm.innerHTML = akaValue;
            if (akaValue.trim().length === 0) {
                const productAKAParent = document.querySelector('.also_known_as');
                productAKAParent.hidden = true;
            }
        }
    }
    
    if (catalogAkaList) {
        for (let i = 0; i < catalogAkaList.length; i++) {
            var catalogItem = catalogAkaList[i];
    
            if (catalogItem.innerHTML === "Other Names:") {
                catalogItem.innerHTML = "Replaces:"
            }
        }
    }
}
    
function handleAka()
{
    const akaElements = document.querySelectorAll('.catalog-also-known-as');
    if (akaElements) {
        for (let i = 0; i < akaElements.length; i++) {
            var akaElm = akaElements[i];
            var nameElm = akaElm.querySelector('strong');
            if (nameElm) {
                if (nameElm.innerHTML === "Other Names:" || nameElm.innerHTML === "Replaces:") {
                    var akaValueElem = akaElm.querySelector('.info-row-content');
                    if (akaValueElem) {
                        var akaValue = akaValueElem.innerHTML;
                        var buttonText = akaValue.match(/<button.*button>/);
                        akaValue = akaValue.replace(/<button.*button>/, '');
                        akaValue = akaValue.replace(/\s+/g, " ");
                        akaValue = akaValue.trim();
                        akaValue = akaValue.replace(", tuner", "");
                        akaValue = akaValue.replace("tuner, ", "");
                        akaValue = akaValue.replace("tuner", "");
                        akaValue = akaValue.replace(", pulley", "");
                        akaValue = akaValue.replace("pulley, ", "");
                        akaValue = akaValue.replace("pulley", "");
                        if (akaValue.trim().length > 0) {
                            akaValueElem.innerHTML = akaValue + ' ' + buttonText;
                            var buttonElm = akaValueElem.querySelector('button');
                            if (buttonElm) {
                                buttonElm.setAttribute('data-full-info', akaValue);
                            }
                        } else {
                            akaElm.hidden = true;
                        }
                    }
                }
            }
        }
    }
}
