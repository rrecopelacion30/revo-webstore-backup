<script>
(function() {

  document.querySelectorAll('.magnaflow-video-container').forEach(function(el) {
    el.remove();
  });

  var allowedPages = [
    "/p-magnaflow-xmod-series-cat-back-performance-exhaust-system-sold-by-magnaflow-68755940aa",
    "/p-magnaflow-speq-series-cat-back-performance-exhaust-system-sold-by-magnaflow-68755939aa"
  ];

  if (allowedPages.indexOf(window.location.pathname) === -1) {
    return;
  }

  if (!document.getElementById('magnaflow-video-styles')) {
    var style = document.createElement('style');
    style.id = 'magnaflow-video-styles';
    style.innerHTML = `
      .magnaflow-video-container video {
        width: 100%;
        height: 350px;
        display: block;
        background: #000;
        object-fit: contain;
      }

      @media (max-width: 767px) {
        .magnaflow-video-container video {
          height: 275px;
        }
      }
    `;
    document.head.appendChild(style);
  }

  function insertVideo() {

    if (document.querySelector('.magnaflow-video-container')) {
      return;
    }

    var target = Array.from(document.querySelectorAll('.main-image')).find(function(el) {
      return el.offsetParent !== null;
    });

    if (!target) {
      return;
    }

    target.insertAdjacentHTML('afterend', `
      <div class="magnaflow-video-container" style="margin-top:16px;">
        <video controls playsinline preload="metadata">
          <source src="https://cdn.revolutionparts.io/6f87c75737bcc72b4674a498139b574d/design/video/magnaflow.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    `);
  }

  insertVideo();
  setTimeout(insertVideo, 1000);
  setTimeout(insertVideo, 3000);

})();
</script>

<script>
  (function() {
    // List of product IDs (in their original form)
    const productIDs = [
      "77072581AB",
      "77072609AA",
      "77072605AA",
      "77072583AB",
      "77072579AD",
      "77072611AA",
      "77072608AA",
      "77073001AA"
    ];

    // Get current URL and normalize to lowercase
    const currentURL = window.location.href.toLowerCase();

    // Check for any matching ID (normalize each to lowercase too)
    const matchFound = productIDs.some(id => currentURL.includes(id.toLowerCase()));

window.addEventListener('load', function() {
    var pageBody = document.querySelector('.main');
    var pageId = pageBody.getAttribute('id');

    switch(pageId) {
        case "page-search":
            updateSearchModule();
            break;
        case "page-dynamic-seo":
            updateSearchModule();
            updateReplaceLabel();
            break;
        case "page-product":
            updateProductModule();
            updateReplaceLabel();
            break;
        case "page-catalog":
            updateSearchModule();
            break;
    }
    
    updateCartModule();
});

function updateSearchModule() {
    const searchListingModule = document.querySelector('.search-listing-module');
    const catalogProductsList = searchListingModule.querySelectorAll('.catalog-product')
    
    for (i = 0; i < catalogProductsList.length; i++) {
        var product = catalogProductsList[i]
        var MSRP = product.querySelector('.list-price-label')
        if(MSRP) {
            MSRP.innerHTML = "MSRP<sup>*</sup>"
        }
    }

    const paginator = document.querySelector('.paginator');
    if (paginator) {
        paginator.addEventListener('click', () => {
            setTimeout(function() {
                updateSearchModule()
            }, 5000)
        });
    }
};

function updateProductModule() {
    const productPurchaseModule = document.querySelector('.product-purchase-module');
    const listPriceLabel = productPurchaseModule.querySelector('.list-price .list-label');
    const youSaveLabel = productPurchaseModule.querySelector('.you-save .list-label');
    const salePriceLabel = productPurchaseModule.querySelector('.sale-price .list-label');
    const listPriceOnly = productPurchaseModule.querySelector('.list-price-only .list-price-label');

    productPurchaseModule.style.opacity = 1;

    if (listPriceLabel) {
        listPriceLabel.innerHTML = 'MSRP<sup>*</sup>:'
    }

    if (youSaveLabel) {
        youSaveLabel.innerText = "Dealer Discount:"
    }

    if (salePriceLabel) {
        salePriceLabel.innerText = "Price:"
    }

    if (listPriceOnly) {
        listPriceOnly.innerHTML = 'MSRP<sup>*</sup>:'
    }
};

function updateCartModule() {
    const addToCartModule = document.getElementById('rp_global_add_to_cart');
    const observerConfig = { childList: true };
    const observer = new MutationObserver(cartCallback);

    if (addToCartModule) {
        observer.observe(addToCartModule, observerConfig);
    }

    function cartCallback(mutationsList, observer) {
        const listPriceLabel = addToCartModule.querySelector('.list_price label');
        const salePriceLabel = addToCartModule.querySelector('.sale_price label');
        
        for(const mutation of mutationsList) {
            if (mutation.type === 'childList') {
                listPriceLabel.innerHTML = 'MSRP<sup>*</sup>'
                salePriceLabel.innerText = "Price"
                break;
            }
        }

        observer.disconnect();
        observer.observe(addToCartModule, {childList: true, subtree: true});
    };
};

function updateReplaceLabel() {
    // Swaps instances of "Other Names" for "Replaces"
    const productAKA = document.querySelector('.also_known_as .list-label');
    const  catalogAkaList= document.querySelectorAll('.catalog-also-known-as strong');

    if (productAKA) {
        productAKA.innerText = "Replaces:"
    }
    
    if (catalogAkaList) {
        for (let i = 0; i < catalogAkaList.length; i++) {
            var catalogItem = catalogAkaList[i];
    
            if (catalogItem.innerHTML === "Other Names:") {
                catalogItem.innerHTML = "Replaces:"
            }
        }
    }
}
